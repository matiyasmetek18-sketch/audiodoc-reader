name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build web app
        run: npm run build

      - name: Create stress fixture
        run: printf '%s\n' 'AudioDoc CI checks upload summaries, chunk retrieval, and shared TTS cache work.' > "$RUNNER_TEMP/audiodoc-stress-fixture.txt"

      - name: Start API
        env:
          NODE_ENV: test
          PORT: 4000
          DATABASE_PATH: ${{ runner.temp }}/audiodoc/app.db
          UPLOAD_DIR: ${{ runner.temp }}/audiodoc/uploads
          AUDIO_DIR: ${{ runner.temp }}/audiodoc/audio
          CACHE_DIR: ${{ runner.temp }}/audiodoc/cache
          TTS_PROVIDER: test
        run: |
          mkdir -p "$RUNNER_TEMP/audiodoc"
          npm run start --workspace apps/api > "$RUNNER_TEMP/audiodoc/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/audiodoc/api.pid"
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4000/health; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/audiodoc/api.log"
          exit 1

      - name: Run stress checks
        env:
          AUDIODOC_URL: http://127.0.0.1:4000
          STRESS_FILE: ${{ runner.temp }}/audiodoc-stress-fixture.txt
          STRESS_PROVIDER: test
          STRESS_VOICE: ci
        run: npm run stress

      - name: Print API log
        if: always()
        run: cat "$RUNNER_TEMP/audiodoc/api.log"

      - name: Stop API
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/audiodoc/api.pid")" 2>/dev/null || true
